[project]
name = "skrooge2firefly"
version = "1.0.0"
description = "Migrate a Skrooge SQLite file to Firefly III, and export it back"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
skrooge-firefly = "skrooge2firefly.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skrooge2firefly"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.9",
    "mypy>=1.10",
    "types-requests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
packages = ["skrooge2firefly"]
mypy_path = "src"
strict = true

[tool.coverage.run]
source = ["skrooge2firefly"]
branch = true
relative_files = true
